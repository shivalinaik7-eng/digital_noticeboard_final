<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - NoticeHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">🎓</div>
        <p class="eyebrow">CAMPUSCONNECT</p>
        <h1>Student Portal</h1>
        <p class="login-subtitle">Sign in to view college announcements.</p>

        <form id="studentLoginForm">
            <label for="enrollmentNo">Enrollment Number</label>
            <input id="enrollmentNo" autocomplete="username" required placeholder="e.g. BCA001">

            <label for="password">Password</label>
            <div class="password-wrap">
                <input id="password" type="password" autocomplete="current-password" required>
                <button type="button" onclick="togglePassword()">Show</button>
            </div>

            <button class="primary-button full-width" type="submit">Login as Student</button>
        </form>

        <p id="loginMessage" class="form-message"></p>
        <div class="portal-links">
            <a class="back-link" href="/login.html">Admin Login</a>
            <a class="back-link" href="/">Notice Board</a>
        </div>
    </div>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
}

document.getElementById("studentLoginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = document.getElementById("loginMessage");
    message.textContent = "Signing in...";
    message.className = "form-message";

    try {
        const response = await fetch("/api/auth/student-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                enrollment_no: document.getElementById("enrollmentNo").value.trim(),
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (!data.success) throw new Error(data.message);

        window.location.href = "/student.html";
    } catch (error) {
        message.textContent = error.message || "Login failed.";
        message.className = "form-message error";
    }
});
</script>
</body>
</html>
