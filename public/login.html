<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - NoticeHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">📢</div>
        <p class="eyebrow">CAMPUSCONNECT</p>
        <h1>Admin Portal</h1>
        <p class="login-subtitle">Sign in to manage college notices.</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" autocomplete="username" required>

            <label for="password">Password</label>
            <div class="password-wrap">
                <input id="password" type="password" autocomplete="current-password" required>
                <button type="button" onclick="togglePassword()">Show</button>
            </div>

            <button class="primary-button full-width" type="submit">Login</button>
        </form>

        <p id="loginMessage" class="form-message"></p>
        <a class="back-link" href="/student-login.html">🎓 Student Portal Login</a>
        <a class="back-link" href="/">← Back to Notice Board</a>
    </div>

<script>
function togglePassword() {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
}

document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = document.getElementById("loginMessage");
    message.textContent = "Signing in...";
    message.className = "form-message";

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (!data.success) {
            throw new Error(data.message);
        }

        window.location.href = "/";
    } catch (error) {
        message.textContent = error.message || "Login failed.";
        message.className = "form-message error";
    }
});
</script>
</body>
</html>
